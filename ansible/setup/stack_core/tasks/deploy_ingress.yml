- name: Template ingress.json
  delegate_to: localhost
  template:
    force: yes
    src: ingress.j2
    dest: "{{role_path}}/files/ingress.nomad"

- name: "Copy ingress.nomad"
  become: true
  copy:
    force: true
    src: ingress.nomad
    dest: "{{core_deployment_dir}}/ingress.nomad"
    mode: '0755'

#
#    - name: "Slurp {{core_deployment_dir}}/ingress.nomad from master_0"
#      ansible.builtin.slurp:
#        src: "{{core_deployment_dir}}/ingress.nomad"
#      register: job

- name: "Create job ingress"
  async: 360
  poll: 5
  shell: nomad job run ingress.nomad
  environment:
    - NOMAD_ADDR: "https://localhost:4646"
    - NOMAD_CACERT: "{{cluster_intermediate_ca_bundle}}"
    - NOMAD_CLIENT_CERT: "{{nomad_cli_cert}}"
    - NOMAD_CLIENT_KEY: "{{nomad_cli_cert_key}}"
  args:
    chdir: "{{core_deployment_dir}}"

- name: Force job to start ingress
  community.general.nomad_job:
    client_cert: "{{nomad_cli_cert}}"
    client_key: "{{nomad_cli_cert_key}}"
    host: localhost
    state: present
    name: ingress
    validate_certs: false
    timeout: 360
    force_start: true

